name: Monitor Geoserver LD layers

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  monitor-ld-layers:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_ID }}
      INSTATUS_API_KEY: ${{ secrets.INSTATUS_API_KEY }}
      INSTATUS_LD_LAYER_PAGE_ID: ${{ secrets.INSTATUS_LD_LAYER_PAGE_ID }}
      INSTATUS_BUCKET: "instatus-bucket"
      S3_KEY: "geoserver/ld/instatus-ld-datatest.json"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd geoserver/hd
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Monitor Geoserver LD layers
        run: |
          export PYTHONPATH=$(pwd)
          python geoserver/ld/monitor_ld_layers.py ${{ env.INSTATUS_BUCKET }} ${{ env.S3_KEY }}