name: Monitor 3D API

on:
  workflow_dispatch:
  schedule:
    # chaque controle genere une 3D par zone (~1 a 2 min) : pas plus souvent que toutes les 30 min
    - cron: '* */2 * * *'

concurrency:
  group: monitor-3d-api
  cancel-in-progress: false

jobs:
  monitor-3d-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      INSTATUS_API_KEY: ${{ secrets.INSTATUS_API_KEY }}
      INSTATUS_3D_PAGE_ID: ${{ secrets.INSTATUS_3D_PAGE_ID }}
      THREED_COMPONENT_ID: ${{ secrets.THREED_COMPONENT_ID }}
      THREED_API_URL: ${{ secrets.THREED_API_URL }}
      THREED_API_KEY: ${{ secrets.THREED_API_KEY }}

    steps:
      # les zones testees viennent du depot : threed/instatus-3d-datatest.json
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r threed/requirements.txt

      - name: Monitor 3D API
        run: |
          export PYTHONPATH=$(pwd)
          python threed/instatus_3d_monitoring.py
